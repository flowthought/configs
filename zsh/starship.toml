format = "$directory$git_branch$git_status$cmd_duration$fill$time\n$character"

[time]
disabled = false
time_format = "‹ %b %-d · %H:%M ›"
format = "[$time](#7AA2F7) "

[fill]
symbol = " "

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold cyan) "
